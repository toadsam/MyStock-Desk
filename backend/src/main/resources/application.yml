server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql,local}
  datasource:
    # DB_CLOSE_DELAY=-1 이 없으면 커넥션 풀이 유휴 커넥션을 모두 닫는 순간
    # 인메모리 DB 가 통째로 사라진다. 잠시 안 쓰다 돌아오면 모든 요청이
    # "Table not found (this database is empty)" 로 실패한다.
    url: jdbc:h2:mem:stockflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # 개발용. 운영 프로파일(prod)에서는 끄고, SecurityConfig 도 이 값이 켜져 있을 때만 /h2-console 을 연다.
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

stockflow:
  # 인증 없이 들어온 요청을 어느 회원으로 볼지. 비워 두면(기본) 로그인 없는 요청은 401 이다.
  # SecurityConfig 가 /api/auth 밖의 모든 요청에 로그인을 요구하므로 평소에는 쓰이지 않는다. 개발 중 잠깐 열 때만 쓴다.
  mock-member-id: ${STOCKFLOW_MOCK_MEMBER_ID:}
  demo:
    # 로그인 화면의 데모 버튼이 쓰는 계정. 여럿이 같이 쓰므로 이 계정의 프로필과 비밀번호는 바꿀 수 없다(DemoAccountPolicy).
    email: ${STOCKFLOW_DEMO_EMAIL:investor@stockflow.com}
  auth:
    login:
      # 같은 주소에서 같은 이메일로 이만큼 틀리면 lock-minutes 동안 맞는 비밀번호도 429 다(LoginAttemptLimiter).
      max-failures: ${STOCKFLOW_LOGIN_MAX_FAILURES:5}
      lock-minutes: ${STOCKFLOW_LOGIN_LOCK_MINUTES:10}
  cors:
    # 쉼표로 나눈 허용 주소. 개발 기본값은 Vite(5173)와 미리보기(3000). 운영은 nginx 가 같은 주소에서 /api 를 넘겨 주므로 비워 둔다.
    allowed-origins: ${STOCKFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  jwt:
    # 개발 전용 기본값. 운영 프로파일은 기본값 없이 STOCKFLOW_JWT_SECRET 을 요구하고, ProductionGuard 가 이 문자열을 거부한다.
    secret: ${STOCKFLOW_JWT_SECRET:stockflow-local-development-secret-key-change-before-production}
    expiration-seconds: ${STOCKFLOW_JWT_EXPIRATION_SECONDS:86400}
  data-refresh:
    enabled: false
  market-data:
    provider: yahoo
  dart:
    enabled: true
    api-key: ${DART_API_KEY:}
  news:
    seed-fallback:
      enabled: false
    google-rss:
      enabled: true
  sec:
    enabled: true
    default-symbols: NVDA,AAPL,MSFT,TSLA,AMD
    user-agent: ${SEC_USER_AGENT:StockFlow/1.0 contact@example.com}
  ai:
    provider: local
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-mini}
