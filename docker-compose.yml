# 서버 한 대에 MySQL, 백엔드, nginx(화면 + /api 프록시)를 함께 띄운다.
#
#   cp .env.example .env        # 값을 채운다. 비밀번호와 JWT 시크릿은 새로 만든다.
#   docker compose up -d --build
#
# .env 가 없거나 필수값이 비면 ${VAR:?...} 에서 멈춘다. 저장소에 비밀값이 들어 있지 않게 하려는 것이다.
# 밖으로 여는 포트는 nginx 의 ${WEB_PORT}(기본 80) 하나다. MySQL 과 백엔드는 compose 네트워크 안에서만 닿는다.
# HTTPS 는 이 앞에 Caddy 나 다른 리버스 프록시를 두어 붙인다.

services:
  mysql:
    image: mysql:8.4
    container_name: stockflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stockflow}
      MYSQL_USER: ${MYSQL_USER:-stockflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 넣으세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 넣으세요}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - stockflow-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: stockflow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-stockflow}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-stockflow}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 넣으세요}
      STOCKFLOW_JWT_SECRET: ${STOCKFLOW_JWT_SECRET:?STOCKFLOW_JWT_SECRET 을 .env 에 넣으세요 (openssl rand -base64 48)}
      STOCKFLOW_CORS_ALLOWED_ORIGINS: ${STOCKFLOW_CORS_ALLOWED_ORIGINS:-}
      DART_API_KEY: ${DART_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STOCKFLOW_PASSWORD_LOGIN_ENABLED: ${STOCKFLOW_PASSWORD_LOGIN_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-StockFlow/1.0 contact@example.com}
    expose:
      - "8080"
    # 이미지의 HEALTHCHECK(/api/health, DB 핑 포함)를 그대로 쓴다. nginx 는 이게 healthy 가 된 뒤에 뜬다.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: stockflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  stockflow-mysql:
