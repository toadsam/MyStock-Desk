# 푸시와 PR 마다 백엔드 테스트, 프론트 린트·타입·빌드, compose 설정 검사를 돈다.
# 셋 다 통과해야 main 에 올릴 만한 상태다. 배포는 하지 않는다.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트 (Java 17, H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --console=plain
      - name: 테스트 보고서 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          # build.gradle 이 산출물을 OS 임시 폴더에 둔다.
          path: /tmp/stockflow-backend-build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: 프론트 린트 · 타입 · 빌드 (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose 설정 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 필수값이 비면 멈추는지
        run: |
          if docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "필수 환경변수 없이 compose 설정이 통과하면 안 됩니다"; exit 1
          fi
      - name: 값을 채우면 통과하는지
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_PASSWORD: ci-app
          STOCKFLOW_JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-0123456789
        run: docker compose --env-file /dev/null config -q
